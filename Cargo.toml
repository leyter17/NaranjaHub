[package]
name = "naranjahub"
version = "1.4.1"
edition = "2021"
rust-version = "1.76"
description = "NaranjaHub: administrador de AppImages simple y profesional para Linux (GNOME, KDE Plasma, COSMIC y XFCE)"
license = "GPL-3.0-only"
authors = ["Leyter Vázquez. V"]

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
dirs = "5"
# Acceso directo al builder de winit para elegir el backend gráfico
# (X11/XWayland tiene arrastrar y soltar; Wayland nativo no lo soporta aún).
winit = { version = "0.30.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
